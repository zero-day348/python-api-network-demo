; config.ini
; 配置信息：请依照注释修改必选项，非必选项可以删除等号后的值

## 登陆账号和密码
[login]
### username：登录用户名，必选参数
username=
### password：登录密码，必选参数
password=

## cookie信息，出发站，目的站
[cookieInfo]
### starts：对应搜索框出发地，必选参数，请输入中文名称，例如：武汉
starts=
### ends：对应搜索框目的地，必选参数，请输入中文名称，例如：南京
ends=
### dtime：对应搜索框出发日，必选参数，时间格式：年-月-日，例如 2025-09-04
## 时间格式2025-09-04
dtime=

## order：车次，选择第几趟，0则从上至下依次点击，必选参数，如果要特定车次，需要先找到车次在列表中的次序，有效值如下：
#### 0->从上至下点击
#### 1->第一个车次
#### 2->第二个车次
[orderItem]
order=0

## users：乘客姓名，必选参数，中文姓名，支持多个乘客，用英文逗号隔开，例如：张三,李四
### 乘客姓名需要提前加入到登录的账号的联系人中，为了程序自动选择乘客姓名
[userInfo]
users =

## 车次类型：
[trainInfo]
### train_types：车次类型，可选参数，默认全部车次，支持多个值，用英文逗号隔开，特别需求的在此指定值，不指定请删除等号后的值，默认是车次不勾选，有效值如下：
#### T->特快
#### G->高铁
#### D->动车
#### Z->直达
#### K->快车
train_types =

### start_time：发车时间，可选参数，不指定请删除等号后的值，默认值“00:00--24:00”
### 时间格式 12:00--18:00，有效值如下：
##### 00:00--24:00->00:00--24:00
##### 00:00--06:00->00:00--06:00
##### 06:00--12:00->06:00--12:00
##### 12:00--18:00->12:00--18:00
##### 18:00--24:00->18:00--24:00
start_time =

[confirmInfo]
## 席别
### seat_type：席别，可选参数，不指定请删除等号后的值，默认按照12306预定到的车次的席别，有效值如下：
#### 硬座
#### 硬卧
#### 软卧
#### 一等软座
#### 二等软座
#### 商务座
#### 一等座
#### 二等座
#### 混编硬座
#### 特等座
seat_type = 二等座

## 是否允许分配无座
## noseat_allow: 默认为1, 表示允许; 0则不允许
noseat_allow = 1

## 网址，必选参数
## 此部分不需改动
[urlInfo]
ticket_url = 
login_url = 
initmy_url = 
buy = 

## 路径信息
[pathInfo]
### driver_name: 浏览器名称，必选参数,可在start函数中指定本地Chrome浏览器路径
driver_name = chrome
### executable_path: 浏览器驱动路径，必选参数
### windows路径例如：C:\Users\sanshunfeng\Downloads\chromedriver.exe
executable_path = C:\Users\Administrator\PycharmProjects\chromedriver.exe


